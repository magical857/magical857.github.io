<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chipGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Circuit Pattern -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="2" fill="none">
    <path d="M50,100 L150,100 L150,200 L250,200 L250,300 L350,300"/>
    <circle cx="50" cy="100" r="5" fill="#ffffff"/>
    <circle cx="150" cy="200" r="5" fill="#ffffff"/>
    <circle cx="250" cy="300" r="5" fill="#ffffff"/>
    <circle cx="350" cy="300" r="5" fill="#ffffff"/>

    <path d="M1150,530 L1050,530 L1050,430 L950,430 L950,330 L850,330"/>
    <circle cx="1150" cy="530" r="5" fill="#ffffff"/>
    <circle cx="1050" cy="430" r="5" fill="#ffffff"/>
    <circle cx="950" cy="330" r="5" fill="#ffffff"/>
    <circle cx="850" cy="330" r="5" fill="#ffffff"/>

    <path d="M100,500 L200,500 L200,400 L300,400"/>
    <circle cx="100" cy="500" r="5" fill="#ffffff"/>
    <circle cx="200" cy="400" r="5" fill="#ffffff"/>
    <circle cx="300" cy="400" r="5" fill="#ffffff"/>

    <path d="M1100,100 L1000,100 L1000,200 L900,200"/>
    <circle cx="1100" cy="100" r="5" fill="#ffffff"/>
    <circle cx="1000" cy="200" r="5" fill="#ffffff"/>
    <circle cx="900" cy="200" r="5" fill="#ffffff"/>
  </g>

  <!-- STM32 Chip Representation -->
  <g transform="translate(600, 280)">
    <!-- Chip body -->
    <rect x="-120" y="-80" width="240" height="160" rx="10" fill="url(#chipGradient)" stroke="#00d4ff" stroke-width="2" filter="url(#glow)"/>

    <!-- Chip pins left -->
    <g fill="#00d4ff">
      <rect x="-130" y="-60" width="15" height="8" rx="2"/>
      <rect x="-130" y="-40" width="15" height="8" rx="2"/>
      <rect x="-130" y="-20" width="15" height="8" rx="2"/>
      <rect x="-130" y="0" width="15" height="8" rx="2"/>
      <rect x="-130" y="20" width="15" height="8" rx="2"/>
      <rect x="-130" y="40" width="15" height="8" rx="2"/>
    </g>

    <!-- Chip pins right -->
    <g fill="#00d4ff">
      <rect x="115" y="-60" width="15" height="8" rx="2"/>
      <rect x="115" y="-40" width="15" height="8" rx="2"/>
      <rect x="115" y="-20" width="15" height="8" rx="2"/>
      <rect x="115" y="0" width="15" height="8" rx="2"/>
      <rect x="115" y="20" width="15" height="8" rx="2"/>
      <rect x="115" y="40" width="15" height="8" rx="2"/>
    </g>

    <!-- Chip pins top -->
    <g fill="#00d4ff">
      <rect x="-80" y="-88" width="8" height="15" rx="2"/>
      <rect x="-50" y="-88" width="8" height="15" rx="2"/>
      <rect x="-20" y="-88" width="8" height="15" rx="2"/>
      <rect x="10" y="-88" width="8" height="15" rx="2"/>
      <rect x="40" y="-88" width="8" height="15" rx="2"/>
      <rect x="70" y="-88" width="8" height="15" rx="2"/>
    </g>

    <!-- Chip pins bottom -->
    <g fill="#00d4ff">
      <rect x="-80" y="73" width="8" height="15" rx="2"/>
      <rect x="-50" y="73" width="8" height="15" rx="2"/>
      <rect x="-20" y="73" width="8" height="15" rx="2"/>
      <rect x="10" y="73" width="8" height="15" rx="2"/>
      <rect x="40" y="73" width="8" height="15" rx="2"/>
      <rect x="70" y="73" width="8" height="15" rx="2"/>
    </g>

    <!-- Chip label -->
    <text x="0" y="-5" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">STM32</text>
    <text x="0" y="25" font-family="Arial, sans-serif" font-size="16" fill="#00d4ff" text-anchor="middle">WiFi Alarm</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="130" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="56" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#glow)">
    停学一年 重新启程
  </text>

  <!-- Subtitle -->
  <text x="600" y="190" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="32" fill="#e0e0e0" text-anchor="middle">
    嵌入式学习之路
  </text>

  <!-- Bottom badge -->
  <g transform="translate(600, 560)">
    <rect x="-150" y="-30" width="300" height="60" rx="30" fill="rgba(255,255,255,0.15)" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="8" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="24" fill="#ffffff" text-anchor="middle">
      WiFi 报警主机开发笔记
    </text>
  </g>

  <!-- Decorative dots -->
  <g opacity="0.6">
    <circle cx="100" cy="100" r="3" fill="#ffffff"/>
    <circle cx="1100" cy="100" r="3" fill="#ffffff"/>
    <circle cx="100" cy="530" r="3" fill="#ffffff"/>
    <circle cx="1100" cy="530" r="3" fill="#ffffff"/>
  </g>
</svg>
